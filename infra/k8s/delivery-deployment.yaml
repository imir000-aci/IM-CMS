apiVersion: apps/v1
kind: Deployment
metadata:
  name: im-cms-delivery
  labels:
    app: im-cms-delivery
spec:
  replicas: 5
  selector:
    matchLabels:
      app: im-cms-delivery
  template:
    metadata:
      labels:
        app: im-cms-delivery
    spec:
      containers:
        - name: delivery
          image: im-cms/delivery:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: DELIVERY_PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: im-cms-secrets
                  key: DATABASE_READ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: im-cms-secrets
                  key: REDIS_URL
            - name: DELIVERY_CACHE_TTL_SECONDS
              value: "30"
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: im-cms-delivery
spec:
  selector:
    app: im-cms-delivery
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP
